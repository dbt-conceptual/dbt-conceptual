version: 2

models:
  - name: dim_customer
    description: Customer dimension table for analytics
    meta:
      concept: customer
    columns:
      - name: customer_id
        description: Primary key - unique customer identifier
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Full name of the customer
      - name: customer_type
        description: Customer segment classification
        tests:
          - accepted_values:
              values: ['retail', 'wholesale', 'enterprise']

  - name: dim_product
    description: Product dimension table
    meta:
      concept: product
    columns:
      - name: product_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: product_name
        description: Product name
      - name: category
        description: Product category

  - name: dim_warehouse
    description: Warehouse dimension table
    meta:
      concept: warehouse
    columns:
      - name: warehouse_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: warehouse_name
        description: Warehouse name
      - name: location
        description: Warehouse location

  - name: fct_orders
    description: Orders fact table with grain of one row per order
    meta:
      concept: order
    columns:
      - name: order_id
        description: Primary key - unique order identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to customer dimension
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: order_date
        description: Date order was placed
      - name: order_total
        description: Total order amount

  - name: fct_order_items
    description: Order line items fact table with grain of one row per product per order
    meta:
      concept: order
    columns:
      - name: order_id
        description: Part of composite key
        tests:
          - not_null
      - name: product_id
        description: Part of composite key
        tests:
          - not_null
      - name: quantity
        description: Quantity ordered
      - name: line_total
        description: Line item total
