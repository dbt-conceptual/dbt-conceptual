version: 2

models:
  - name: fact_agent_instance_work
    description: Agent instance work fact - tracks work performed by agent instances
    columns:
      - name: agent_instance_tk
        description: Agent instance technical key
        tests:
          - unique
          - not_null
      - name: agent_sk
        description: Agent dimension surrogate key (Type 2 SCD)
      - name: ticket_sk
        description: Ticket dimension surrogate key (Type 2 SCD)
      - name: model_sk
        description: Model dimension surrogate key (Type 1)
      - name: instance_duration_minutes
        description: Duration of agent instance in minutes
      - name: lifecycle_event_count
        description: Count of lifecycle events for this instance
      - name: ticket_activity_count
        description: Count of ticket activities for this instance
      - name: pr_activity_count
        description: Count of PR activities for this instance

  - name: fact_agent_instance_cost
    description: Agent instance cost fact - aggregates token usage and costs
    columns:
      - name: agent_instance_tk
        description: Agent instance technical key
        tests:
          - unique
          - not_null
      - name: agent_sk
        description: Agent dimension surrogate key (Type 2 SCD)
      - name: ticket_sk
        description: Ticket dimension surrogate key (Type 2 SCD)
      - name: model_sk
        description: Model dimension surrogate key (Type 1)
      - name: total_token_input_count
        description: Total input tokens consumed
      - name: total_token_output_count
        description: Total output tokens generated
      - name: total_token_cache_read_count
        description: Total cache read tokens
      - name: total_token_cache_create_count
        description: Total cache create tokens
      - name: total_token_cost_usd
        description: Total cost in USD

  - name: fact_ticket_lifecycle
    description: Ticket lifecycle fact - tracks ticket status changes over time
    columns:
      - name: agent_instance_tk
        description: Agent instance technical key
        tests:
          - not_null
      - name: ticket_sk
        description: Ticket dimension surrogate key (Type 2 SCD)
      - name: agent_sk
        description: Agent dimension surrogate key (Type 2 SCD)
      - name: ticket_event_type
        description: Type of ticket event
      - name: ticket_status
        description: Ticket status after this event
      - name: previous_status
        description: Ticket status before this event
      - name: time_in_previous_status_minutes
        description: Time spent in previous status (minutes)

  - name: fact_pr_delivery
    description: PR delivery fact - tracks pull request delivery metrics
    columns:
      - name: pr_submission_tk
        description: PR submission technical key
        tests:
          - unique
          - not_null
      - name: pull_request_sk
        description: Pull request dimension surrogate key (Type 1)
      - name: ticket_sk
        description: Ticket dimension surrogate key (Type 2 SCD)
      - name: agent_sk
        description: Agent dimension surrogate key (Type 2 SCD)
      - name: pr_lines_added
        description: Number of lines added in PR
      - name: pr_lines_deleted
        description: Number of lines deleted in PR
      - name: pr_files_changed
        description: Number of files changed in PR
      - name: time_to_merge_minutes
        description: Time from PR creation to merge (minutes)
      - name: review_count
        description: Number of reviews for this PR

  - name: fact_review_quality
    description: Review quality fact - tracks code review quality metrics
    columns:
      - name: review_submission_tk
        description: Review submission technical key
        tests:
          - unique
          - not_null
      - name: pull_request_sk
        description: Pull request dimension surrogate key (Type 1)
      - name: agent_sk
        description: Agent dimension surrogate key (Type 2 SCD)
      - name: review_round
        description: Review round number
      - name: review_verdict
        description: Review verdict (approve, request_changes, etc.)
      - name: review_duration_minutes
        description: Duration of review in minutes
      - name: finding_count
        description: Total number of findings
      - name: blocking_finding_count
        description: Number of blocking findings
      - name: advisory_finding_count
        description: Number of advisory findings

  - name: fact_sprint_burndown
    description: Sprint burndown fact - tracks ticket progress within sprints
    columns:
      - name: ticket_tk
        description: Ticket technical key
        tests:
          - not_null
      - name: ticket_sk
        description: Ticket dimension surrogate key (Type 2 SCD)
      - name: sprint_sk
        description: Sprint dimension surrogate key (Type 2 SCD)
      - name: sprint_code
        description: Sprint business key
      - name: ticket_status
        description: Ticket status at this event
      - name: event_ts
        description: Timestamp of status change event
      - name: event_sequence
        description: Sequence number of event within sprint
      - name: ticket_completed_at
        description: Timestamp when ticket was completed in this sprint
