version: 2

models:
  # Standing Links
  - name: l_agent_skillset
    description: Standing link - Agent has a skillset (constructed combination)
    columns:
      - name: agent_skillset_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent
        tests:
          - not_null
      - name: skillset_tk
        description: Foreign key to h_skillset
        tests:
          - not_null

  - name: l_skill_skillset
    description: Standing link - Decomposes skillset back to individual skills
    columns:
      - name: skill_skillset_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: skill_tk
        description: Foreign key to h_skill
        tests:
          - not_null
      - name: skillset_tk
        description: Foreign key to h_skillset
        tests:
          - not_null

  - name: l_agent_craft
    description: Standing link - Agent uses a craft
    columns:
      - name: agent_craft_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent
        tests:
          - not_null
      - name: craft_tk
        description: Foreign key to h_craft
        tests:
          - not_null

  - name: l_agent_personality
    description: Standing link - Agent uses a personality
    columns:
      - name: agent_personality_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent
        tests:
          - not_null
      - name: personality_tk
        description: Foreign key to h_personality
        tests:
          - not_null

  # Transactional Links
  - name: ln_agent_instance
    description: Transactional link - Agent instance (central transactional link)
    columns:
      - name: agent_instance_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent
        tests:
          - not_null
      - name: model_tk
        description: Foreign key to h_model
        tests:
          - not_null
      - name: ticket_tk
        description: Foreign key to h_ticket
        tests:
          - not_null

  - name: ln_pr_submission
    description: Transactional link - PR created for a ticket
    columns:
      - name: pr_submission_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: pull_request_tk
        description: Foreign key to h_pull_request
        tests:
          - not_null
      - name: ticket_tk
        description: Foreign key to h_ticket
        tests:
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent (creator)
        tests:
          - not_null

  - name: ln_review_submission
    description: Transactional link - Review of a PR
    columns:
      - name: review_submission_tk
        description: Link technical key
        tests:
          - unique
          - not_null
      - name: review_tk
        description: Foreign key to h_review
        tests:
          - not_null
      - name: pull_request_tk
        description: Foreign key to h_pull_request
        tests:
          - not_null
      - name: agent_tk
        description: Foreign key to h_agent (reviewer)
        tests:
          - not_null
