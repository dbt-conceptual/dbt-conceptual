version: 2

models:
  - name: h_agent
    description: Hub for Agent business key
    columns:
      - name: agent_tk
        description: Technical key (SHA1 of agent_code)
        tests:
          - unique
          - not_null
      - name: agent_code
        description: Business key for agent
        tests:
          - not_null

  - name: h_model
    description: Hub for Model business key
    columns:
      - name: model_tk
        description: Technical key (SHA1 of model_code)
        tests:
          - unique
          - not_null
      - name: model_code
        description: Business key for model
        tests:
          - not_null

