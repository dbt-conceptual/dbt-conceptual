[project]
name = "herd-mcp"
version = "0.1.0"
description = "MCP server for Herd agent operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
    "slack_sdk>=3.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
adapters = [
    "herd-core @ git+https://github.com/herd-ag/herd-core.git",
    "herd-notify-slack @ git+https://github.com/herd-ag/herd-notify-slack.git",
    "herd-ticket-linear @ git+https://github.com/herd-ag/herd-ticket-linear.git",
    "herd-repo-github @ git+https://github.com/herd-ag/herd-repo-github.git",
    "herd-agent-claude @ git+https://github.com/herd-ag/herd-agent-claude.git",
    "herd-store-duckdb @ git+https://github.com/herd-ag/herd-store-duckdb.git",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
