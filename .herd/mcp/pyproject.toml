[project]
name = "herd-mcp"
version = "0.1.0"
description = "MCP server for Herd agent operations"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
